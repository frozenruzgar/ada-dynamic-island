name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  package:
    runs-on: macos-15
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
      RELEASE_TAG: ${{ github.ref_name }}
      SIGN_IDENTITY: ${{ secrets.SIGN_IDENTITY }}
      CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
      CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check tag version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)"
          test "$RELEASE_TAG" = "v$version"
      - name: Prepare optional signing
        shell: bash
        run: |
          if [[ -z "$CERTIFICATE_P12" ]]; then
            test -z "$SIGN_IDENTITY"
            test -z "$APPLE_APP_PASSWORD"
            exit 0
          fi
          test -n "$CERTIFICATE_PASSWORD" && test -n "$KEYCHAIN_PASSWORD" && test -n "$SIGN_IDENTITY"
          keychain="$RUNNER_TEMP/ada-signing.keychain-db"
          certificate="$RUNNER_TEMP/ada-signing.p12"
          printf '%s' "$CERTIFICATE_P12" | base64 --decode > "$certificate"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security -t cert -f pkcs12 -k "$keychain" >/dev/null
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          rm "$certificate"
          if [[ -n "$APPLE_APP_PASSWORD" ]]; then
            test -n "$APPLE_ID" && test -n "$APPLE_TEAM_ID"
            xcrun notarytool store-credentials ada-ci --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD"
            echo 'NOTARY_PROFILE=ada-ci' >> "$GITHUB_ENV"
          fi
      - run: ./scripts/build.sh
      - run: ./scripts/check.sh
      - run: ./scripts/release.sh
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          package="Ada-${RELEASE_TAG#v}-AppleSilicon.dmg"
          download="https://github.com/$GITHUB_REPOSITORY/releases/download/$RELEASE_TAG/$package"
          printf '## [↓ Ada’yı indir / Download Ada (.dmg)](%s)\n\n' "$download" > "$notes"
          printf 'Apple Silicon (M serisi / M-series) · macOS 14+\n\n' >> "$notes"
          printf 'DMG’yi aç, **Ada**’yı **Uygulamalar** klasörüne sürükle ve oradan aç.\n\n' >> "$notes"
          printf 'Open the DMG, drag **Ada** into **Applications**, and open it from there.\n\n' >> "$notes"
          flags=(--prerelease)
          if [[ -n "${NOTARY_PROFILE:-}" ]]; then
            printf 'Developer ID signed and notarized.\n' >> "$notes"
            flags=(--latest)
          else
            printf 'Noter onaysız önizleme / Unnotarized preview. [Apple Support](https://support.apple.com/102445)\n' >> "$notes"
          fi
          gh release create "$RELEASE_TAG" "dist/$package" --verify-tag --title "Ada $RELEASE_TAG" --notes-file "$notes" "${flags[@]}"
      - name: Remove temporary keychain
        if: always()
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/ada-signing.keychain-db"
          if [[ -f "$keychain" ]]; then security delete-keychain "$keychain"; fi
